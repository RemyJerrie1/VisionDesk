[project]
name = "visiondesk"
version = "0.1.0"
description = "Desktop LoRA fine-tuning of ResNet50 — freeze backbone, train a tiny low-rank adapter, on your own images. Local, CPU, free."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
